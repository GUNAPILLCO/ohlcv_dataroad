# Archivo de cierre de TDA-15 (No linealidad residual; TH32, TH33). REGISTRO DOCUMENTAL.
#
# TDA-15 se cierra mediante `STOP-15a` SIN EJECUTAR ningun analisis: no se leyeron datos
# del MNQ, no se construyo ningun residuo, no se ejecuto BDS ni el F-test de Tsay y no se
# genero ningun estadistico, tabla, grafico, simulacion ni metrica G2. Este archivo no
# contiene ni modifica ningun parametro estadistico.
#
# Trazabilidad: cada evidencia declara el archivo de origen (`fuente`) y una cita LITERAL
# (`cita`) que debe aparecer en el; `tests/test_tda15_cierre.py` lo comprueba, junto con la
# concordancia entre este archivo y `reports/mnq/TDA15_no_linealidad_residual.md`.
etapa: "TDA-15"
titulo: "No linealidad residual"
hipotesis: ["TH32", "TH33"]
estado: "CERRADA METODOLÓGICAMENTE — STOP-15a ACTIVADO — ANÁLISIS NO EJECUTADO"
decision: "STOP-15a: NO EJECUTAR"
fecha_cierre: "2026-10-15"
base_commit: "c4efa271c785ef4c10d1884cfecd5937125c6e1d"
naturaleza: >-
  Decisión metodológica de no ejecutar pruebas cuyas condiciones de entrada no se cumplen.
  NO es un resultado empírico negativo sobre la existencia de no linealidad: no aporta
  evidencia nueva ni a favor ni en contra.
decisiones_diseno_iris: "NINGUNA"

condiciones_entrada:
  A_residuo_limpio:
    estado: "NO CUMPLIDA"
    resumen: >-
      No existe un residuo estandarizado limpio, causal y auditado de media, volatilidad y
      estacionalidad. Es la justificación de STOP-15a.
    evidencias: [E01, E02, E03, E04, E05, E06, E07, E08, E09, E10, E11, E12, E13]
  B_estabilidad_temporal:
    estado: "CUMPLIDA FORMALMENTE, CON LIMITACIONES"
    resumen: >-
      STOP-14 = NO_ACTIVADO satisface formalmente el criterio 2 del roadmap. No demuestra
      estabilidad general: RELOJ INESTABLE; ESCALA, DEPENDENCIA_MAGNITUD y DISCRECION
      NO_EVALUABLE; variación anual importante de la volatilidad sin ruptura estructural
      demostrada.
    evidencias: [E14, E15, E16, E17, E18, E19, E20]
  C_pregunta_cientifica:
    estado: "PENDIENTE — NO DESARROLLADA"
    resumen: >-
      No se aprobó ninguna hipótesis específica sobre la forma de la dependencia residual.
      No se desarrolla porque la condición A bloquea la ejecución. No es una prueba fallida.
  D_multiplicidad_y_calibracion:
    estado: "PENDIENTE — NO DESARROLLADA"
    resumen: >-
      No se congelaron variantes, parámetros (k, delta, rezagos), corrección por
      multiplicidad ni controles G2 específicos de TDA-15. No se desarrolla porque la
      condición A bloquea la ejecución. No es una prueba fallida.

