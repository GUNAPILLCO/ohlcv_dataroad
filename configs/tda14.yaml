  limitaciones_generador:
  - 'Persistencia de la volatilidad diaria: AR(1). La memoria larga real no se reproduce con un solo AR(1); la region compatible (0,970 a >= 0,999)
    se cubre con tres controles negativos predeclarados. La cota superior no esta identificada por los datos.'
  - 'Dependencia intradia: ajuste restringido (reproduce la variacion diaria); la persistencia media de |r| sintetica es ~25 % menor que la real
    (0,25 frente a 0,33). Afecta sobre todo a DEPENDENCIA_MAGNITUD.'
  - 'DEPENDENCIA_MAGNITUD: sin controles de potencia (no alcanzables con el generador). La familia sigue en el detector y en el error global,
    pero nunca puede declararse ESTABLE (potencia no validada -> NO_EVALUABLE).'
  - 'Cobertura de jornadas: el MNQ tiene 95 jornadas incompletas (cierres anticipados, festivos, cortes) y 60 de 65 ventanas con cobertura suficiente;
    el mundo simulado tiene 0 jornadas incompletas y 65 de 65 ventanas. Los controles no reproducen las jornadas cortas ni la ausencia de ventanas
    por cobertura.'
  - 'Huecos: el generador inserta como mucho un hueco por jornada de 1-30 minutos (uniforme); en el MNQ casi todos son de 1 minuto y hubo una
    pausa programada de 15 minutos a las 16:15 NY hasta el 28-06-2021 (cambio institucional no simulado).'
  - 'Duracion de la sesion: el MNQ tiene barras en el minuto de sesion 1380 (17:00 NY) en 1339 jornadas; el generador usa 1380 minutos (0-1379).'
  - 'Precio: constante en el mundo negativo (14.339); el real pasa de ~10.200 (2020) a ~20.700 (2025), y con el cambia la discrecion.'
  - 'Perfil de reloj: forma fija del generador (picos 08:00, 09:30 y 16:00 NY); solo se ajusta su amplitud.'
  - 'Colas: t de Student con varianza unidad (4,79 g.l.); la curtosis total sintetica es mayor que la real (no se usa en el detector).'
  - 'Estacionalidad: no distinguible de la persistencia en el MNQ; la variante estacional (amplitud 0,087) es un control de estres, no una estacionalidad
    demostrada.'
  - 'Volumen: el generado no representa el real; la familia ACTIVIDAD queda fuera del detector (descriptiva, no calibrada).'
