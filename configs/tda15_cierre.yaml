hipotesis_estado:
  TH32:
    estado: "NO EVALUADA POR STOP-15a"
    detalle: >-
      No se ejecutaron BDS ni F-test de Tsay. No existe evidencia nueva para afirmar o negar
      la presencia de no linealidad residual.
  TH33:
    estado: "NO EVALUADA POR DEPENDENCIA DE TH32"
    detalle: >-
      No se realizaron pruebas de no linealidad a 1, 5 y 10 minutos. No se puede concluir nada
      nuevo sobre su comportamiento al cambiar la frecuencia.

