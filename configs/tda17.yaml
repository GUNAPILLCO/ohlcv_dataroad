integridad:
  manifiesto: reports/mnq/TDA17_manifiesto_protocolo.json
  herramienta: src/ohlcv_dataroad/ingest/tda17_protocol_freeze.py
  n_entradas: 5
  n_artefactos_previos: 188
  modos:
    ESTRICTO: "verificacion oficial (python -m ohlcv_dataroad.ingest.tda17_protocol_freeze verificar, o pytest con TDA17_INTEGRIDAD=estricta): falla si falta o difiere cualquier fichero del protocolo, entrada o artefacto previo"
    PORTABLE: "solo tests (por defecto, TDA17_INTEGRIDAD sin definir o =portable): omite con SKIP los ficheros ausentes, verifica los presentes; NO vale para congelar ni para autorizar la ejecucion"
  ficheros_protocolo: 9              # PROTOCOL_FILES de la herramienta
  validacion_rutas: "antes de calcular cualquier hash (verificar, manifiesto, congelar) se validan TODAS las rutas del manifiesto sin leer contenido: solo rutas relativas POSIX normalizadas (sin absolutas, .., barra invertida ni unidad); se rechazan el directorio de datos brutos (FORBIDDEN_PREFIXES de la herramienta), nombres de configs/mnq_snapshot.yaml holdout.holdout_files, rutas con holdout, y rutas que resuelven (enlaces incluidos) fuera del repositorio o a una ubicacion prohibida; una sola ruta prohibida detiene la verificacion sin abrir ningun fichero"
  evidencia_sintetica: [tests/test_tda17_calentamiento_huecos.py, tests/test_tda17_diseno_v4a_sintetico.py, tests/test_tda17_diseno_v4b_g23b_viabilidad.py, tests/test_tda17_g2_2_generador.py, tests/test_tda17_supertrend.py]
  congelamiento:
    comando: "python -m ohlcv_dataroad.ingest.tda17_protocol_freeze congelar --confirmar"
    precondiciones: ["YAML, informe y manifiesto en PENDIENTE_AUDITORIA_FINAL", "verificacion ESTRICTA conforme", "HEAD desciende de base_git", "sin ficheros versionados modificados"]
    cambios: "solo la linea protocolo.estado del YAML y la linea **Estado:** del informe; el manifiesto pasa a CONGELADO con el registro congelamiento (fecha, HEAD, transiciones y huellas auditadas en PENDIENTE de los 9 ficheros del protocolo)"
    atomicidad: "contenido nuevo calculado y validado en memoria; escritura con os.replace; verificacion ESTRICTA posterior; ante cualquier fallo se restauran los bytes originales de los tres ficheros"
    verificacion_posterior: "en CONGELADO: YAML e informe, tras deshacer la transicion, reproducen exactamente su huella auditada; los otros 7 ficheros coinciden exactamente con la suya; recalcular el hash ordinario del manifiesto no oculta ninguna modificacion"
    referencia_externa: "el registro vive dentro del manifiesto: una reescritura completa y coherente del manifiesto solo se detecta contra el commit Git del congelamiento (verificar --referencia-git <commit>, compara los 9 ficheros y el manifiesto) y contra los SHA-256 auditados publicados en la revision"
    despues: "TDA17_INTEGRIDAD=estricta python -m pytest tests/test_tda17_protocol.py tests/test_tda17_calentamiento_huecos.py tests/test_tda17_diseno_v4a_sintetico.py tests/test_tda17_diseno_v4b_g23b_viabilidad.py tests/test_tda17_g2_2_generador.py tests/test_tda17_supertrend.py; tras el commit: verificar --referencia-git <commit>"
  regeneracion_manifiesto: "solo en PENDIENTE; el manifiesto candidato se verifica en memoria antes de escribir y, ante cualquier fallo antes, durante o despues de la escritura, queda identico byte a byte al anterior"

